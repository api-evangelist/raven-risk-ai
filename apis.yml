description: Raven Risk AI is an AI platform for credit managers and investment professionals
  that automates credit analysis workflows — financial data analysis, due diligence, risk
  assessment, and report generation — to help teams assess and monitor investments with
  greater speed and precision. Founded in 2023 by Blair Fleming and based in Manhattan, New
  York, the company is backed by 500 Global. The platform integrates internal and external
  data sources, applies fine-tuned AI models for credit assessment, and supports deal
  tracking and firm knowledge management. No public API, developer portal, or documentation
  is currently published; this profile tracks the company as an API Evangelist network lead
  pending an eventual developer surface.
